name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - run: aiken --version
      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build -o blueprint/plutus.json
      - uses: actions/upload-artifact@v4
        with:
          name: plutus-blueprint
          path: blueprint/plutus.json
          retention-days: 30
